name: Android app

on:
  push:
    paths-ignore: ['**.md', 'legacy/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Add Supabase config from repository secrets (optional)
        if: env.SUPABASE_URL != '' && env.SUPABASE_ANON_KEY != ''
        run: |
          printf "window.FE_CONFIG = { supabaseUrl: '%s', supabaseAnonKey: '%s' };\n" "$SUPABASE_URL" "$SUPABASE_ANON_KEY" > js/config.js

      - name: Build web app and create the Android project
        run: |
          npm run build
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor '#1a1a2e' --splashBackgroundColor '#1a1a2e'
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk FrancaisExam.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FrancaisExam-android
          path: FrancaisExam.apk

      - name: Publish to the "android-latest" release (main branch only)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: FrançaisExam — Android (latest build)
          prerelease: true
          make_latest: false
          body: |
            Latest Android build of FrançaisExam, made automatically from `main`.
            On your Android phone: download **FrancaisExam.apk**, open it and allow "Install unknown apps" when asked.
          files: FrancaisExam.apk
